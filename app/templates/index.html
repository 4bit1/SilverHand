<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElderSkill - Voice Interview</title>
    <style>
        :root {
            --bg: #FAF8F5;
            --text-primary: #2C2C2C;
            --text-secondary: #6B6B6B;
            --accent: #7A8B5C;
            --accent-light: #E8EDE0;
            --border: #E5E0D8;
            --error: #B85C5C;
            --success: #4CAF50;
            --font-serif: Georgia, serif;
            --font-sans: -apple-system, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--bg); color: var(--text-primary); min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; max-width: 1100px; margin: 0 auto; }
        .brand { font-family: var(--font-serif); font-size: 22px; font-weight: 600; text-decoration: none; color: var(--text-primary); }
        .nav { display: flex; gap: 24px; align-items: center; }
        .nav-link { color: var(--text-secondary); text-decoration: none; font-size: 14px; }
        .dashboard-btn { background: var(--text-primary); color: white; padding: 8px 18px; border-radius: 8px; text-decoration: none; font-size: 14px; cursor: pointer; }
        .main { max-width: 700px; margin: 0 auto; padding: 40px 24px 80px; }
        .progress-container { margin-bottom: 40px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
        .progress-bar { width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); transition: width 0.5s; }
        .status-label { font-size: 13px; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
        .question-text { font-family: var(--font-serif); font-size: 30px; line-height: 1.35; margin-bottom: 24px; }
        .voice-message { text-align: center; font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
        .microphone-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 28px; }
        .microphone-btn { width: 88px; height: 88px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(122,139,92,0.35); }
        .microphone-btn.recording { background: var(--error); animation: pulse 1.5s infinite; }
        .microphone-btn.success { background: var(--success); }
        @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(184,92,92,0.4)} 70%{box-shadow:0 0 0 20px rgba(184,92,92,0)} 100%{box-shadow:0 0 0 0 rgba(184,92,92,0)} }
        .microphone-icon { color: white; width: 36px; height: 36px; }
        .mic-label { margin-top: 10px; font-size: 14px; color: var(--text-secondary); }
        .answer-textarea { width: 100%; min-height: 90px; padding: 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; resize: vertical; margin-bottom: 20px; }
        .action-buttons { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 30px; }
        .btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; border: none; }
        .btn-primary { background: var(--text-primary); color: white; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
        .transcript-section { padding-top: 20px; border-top: 1px solid var(--border); }
        .transcript-title { font-size: 15px; font-weight: 500; margin-bottom: 12px; }
        .transcript-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
        .transcript-q { font-size: 13px; color: var(--text-secondary); }
        .transcript-a { font-size: 14px; margin-top: 2px; }
        
        /* AI SUMMARY - PROMINENT DISPLAY */
        .ai-summary-section {
            display: none;
            margin-top: 30px;
            padding: 30px;
            background: linear-gradient(135deg, #E8EDE0 0%, #D4E0C5 100%);
            border-radius: 16px;
            border: 2px solid var(--accent);
            box-shadow: 0 8px 24px rgba(122, 139, 92, 0.25);
        }
        .ai-summary-section.show { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .ai-summary-title { font-size: 18px; font-weight: 700; color: #4A5D3A; text-align: center; margin-bottom: 16px; }
        .ai-summary-text { font-size: 16px; line-height: 2; color: #333; font-style: italic; text-align: justify; }
        .return-home { margin-top: 32px; text-align: center; }
        .return-link { color: var(--text-muted, #9B9B9B); text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="brand">ElderSkill</a>
        <nav class="nav">
            <a href="#" class="nav-link">How it works</a>
            <a href="#" class="nav-link">For organisations</a>
            <a href="#" class="nav-link">Trust</a>
            <a href="/dashboard" class="dashboard-btn">Go to my dashboard</a>
        </nav>
    </header>

    <main class="main">
        <div class="progress-container">
            <div class="progress-info"><span id="progressPct">0% complete</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>

        <div class="status-label" id="statusLabel">Ready</div>
        <h1 class="question-text" id="questionText">Loading...</h1>

        <div class="voice-message" id="voiceMessage">Tap the microphone to speak</div>

        <div class="microphone-section">
            <button class="microphone-btn" id="micBtn">
                <svg class="microphone-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
            <div class="mic-label" id="micLabel">Tap to speak</div>
        </div>

        <textarea class="answer-textarea" id="answerText" placeholder="Or type your answer here..."></textarea>

        <div class="action-buttons">
            <button class="btn btn-secondary" onclick="replayQuestion()">🔊 Replay</button>
            <button class="btn btn-primary" onclick="submitText()">Continue</button>
        </div>

        <div class="transcript-section">
            <div class="transcript-title">Transcript</div>
            <div id="transcriptList"></div>
        </div>

        <!-- AI SUMMARY DISPLAYED BELOW TRANSCRIPT -->
        <div class="ai-summary-section" id="aiSummarySection">
            <div class="ai-summary-title">✨ Your AI-Generated Profile Summary ✨</div>
            <div class="ai-summary-text" id="aiSummaryText"></div>
        </div>

        <div class="return-home">
            <a href="/dashboard" class="return-link">Go to Dashboard →</a>
        </div>
    </main>

    <script>
        let sessionId = null;
        let currentQuestion = '';
        let progress = 0;
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let audioStream = null;

        async function startInterview() {
            const userId = localStorage.getItem('elderskill_user_id');
            if (!userId) { window.location.href = '/auth'; return; }
            
            const res = await fetch('/api/interviews/start', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: userId})
            });
            const result = await res.json();
            
            if (result.success) {
                sessionId = result.data.session_id;
                currentQuestion = result.data.question;
                document.getElementById('questionText').textContent = currentQuestion;
                document.getElementById('statusLabel').textContent = 'Ready';
                speakQuestion();
            }
        }

        async function speakQuestion() {
            if (!currentQuestion) return;
            try {
                const res = await fetch('/api/tts', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: currentQuestion, language: 'en-IN'})
                });
                if (res.ok) {
                    const blob = await res.blob();
                    const audio = new Audio(URL.createObjectURL(blob));
                    audio.volume = 1.0;
                    audio.play().catch(() => {});
                }
            } catch(e) {}
        }

        function replayQuestion() { speakQuestion(); }

        document.getElementById('micBtn').addEventListener('click', function() {
            if (isRecording) { stopRecording(); } else { startRecording(); }
        });

        async function startRecording() {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({audio: true});
                mediaRecorder = new MediaRecorder(audioStream, {mimeType: 'audio/webm;codecs=opus'});
                audioChunks = [];
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = processAudio;
                mediaRecorder.start(500);
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                document.getElementById('micLabel').textContent = 'Listening... Click to stop';
            } catch(e) {}
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            if (audioStream) audioStream.getTracks().forEach(t => t.stop());
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
            document.getElementById('micLabel').textContent = 'Processing...';
        }

        async function processAudio() {
            const blob = new Blob(audioChunks, {type: 'audio/webm'});
            const formData = new FormData();
            formData.append('audio', blob, 'recording.webm');
            
            const res = await fetch('/api/interviews/' + sessionId + '/answer', {method: 'POST', body: formData});
            const result = await res.json();
            handleResult(result);
        }

        async function submitText() {
            const text = document.getElementById('answerText').value.trim();
            if (!text) return;
            const res = await fetch('/api/interviews/' + sessionId + '/answer', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text_answer: text})
            });
            const result = await res.json();
            document.getElementById('answerText').value = '';
            handleResult(result);
        }

        function handleResult(result) {
            if (!result.success) {
                document.getElementById('micLabel').textContent = 'Tap to speak';
                return;
            }
            
            const data = result.data;
            
            const list = document.getElementById('transcriptList');
            const item = document.createElement('div');
            item.className = 'transcript-item';
            item.innerHTML = '<div class="transcript-q">' + currentQuestion + '</div><div class="transcript-a">' + (data.transcript || '') + '</div>';
            list.appendChild(item);
            
            progress = data.progress || progress;
            document.getElementById('progressPct').textContent = Math.round(progress * 100) + '% complete';
            document.getElementById('progressFill').style.width = Math.round(progress * 100) + '%';
            
            document.getElementById('micBtn').classList.add('success');
            document.getElementById('micLabel').textContent = 'Answer captured';
            
            if (data.completed) {
                document.getElementById('progressPct').textContent = '100% complete';
                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('questionText').textContent = 'Your conversation is complete!';
                document.getElementById('statusLabel').textContent = '🎉 Complete';
                document.getElementById('micBtn').style.display = 'none';
                document.getElementById('micLabel').textContent = '';
                
                console.log('Completion data:', data);
                
                // DISPLAY AI SUMMARY
                const summarySection = document.getElementById('aiSummarySection');
                const summaryText = document.getElementById('aiSummaryText');
                
                if (data.summary && summarySection && summaryText) {
                    summaryText.textContent = data.summary;
                    summarySection.style.display = 'block';
                    summarySection.classList.add('show');
                    console.log('✅ AI Summary displayed:', data.summary.substring(0, 100));
                    
                    // Scroll to summary
                    setTimeout(() => {
                        summarySection.scrollIntoView({behavior: 'smooth', block: 'center'});
                    }, 500);
                } else {
                    console.log('❌ No summary in response or elements missing');
                    console.log('Summary value:', data.summary);
                    console.log('Summary section exists:', !!summarySection);
                }
                return;
            }
            
            currentQuestion = data.next_question;
            setTimeout(() => {
                document.getElementById('micBtn').classList.remove('success');
                document.getElementById('micLabel').textContent = 'Tap to speak';
                document.getElementById('questionText').textContent = currentQuestion;
                speakQuestion();
            }, 1000);
        }

        startInterview();
    </script>
</body>
</html>
